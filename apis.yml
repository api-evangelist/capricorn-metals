description: 'Capricorn Metals Ltd (ASX: CMM) is an Australian gold producer headquartered in Perth, Western Australia. It operates two project areas in Western Australia: the Karlawinda Gold Project, 65 km south-east of Newman in the Pilbara and in production since June 2021, and the Mt Gibson Gold Project, with a combined stated resource base of 6.6 million ounces and reserves of 4.0 million ounces. The company publishes no public API, developer portal or developer documentation; its website (capmetals.com.au) covers corporate, investor, sustainability and project information.'

